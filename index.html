<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Dorm</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <div id="login-screen" class="screen">
    <h2 style="text-align: center;">Smart Dorm</h2>
    <input type="email" placeholder="Email address">
    <input type="password" placeholder="Password">
    <button onclick="showScreen('dashboard-screen')">Log in</button>
  </div>

  <div id="dashboard-screen" class="screen hidden">
    <h3>Hello, Balnur!</h3>
    <p>Welcome back to Smart Dorm</p>
    <div class="card" onclick="showScreen('maintenance-screen')">
      <b>Maintenance</b>
    </div>
  </div>


  <div id="maintenance-screen" class="screen hidden">
    <button onclick="showScreen('dashboard-screen')" style="width: auto; background: none; color: #333;">← Back</button>
    <h3>Maintenance Request</h3>
    <label>Problem category</label>
    <select><option>Select category</option></select>
    <label>Description</label>
    <textarea placeholder="Describe the issue"></textarea>
    <button onclick="alert('Заявка отправлена!'); showScreen('dashboard-screen')">Submit</button>
  </div>

  <script>
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
      document.getElementById(screenId).classList.remove('hidden');
    }
  </script>

</body>
</html>
